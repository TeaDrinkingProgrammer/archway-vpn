[package]
name = "archway-vpn"
version = "0.4.0"
edition = "2024"
# egui needs 1.95; checked by the msrv job in .github/workflows/ci.yml
rust-version = "1.95"
authors = ["Stijn van Houwelingen <teadrinkingprogrammer@proton.me>", "Wilco van Beijnum <github@wilcovanbeijnum.nl>"]
description = "Connect to FortiGate IPsec (IKEv2) and Azure VPN (Microsoft Entra ID) gateways with single sign-on"
license = "MIT OR Apache-2.0"
repository = "https://github.com/TeaDrinkingProgrammer/archway-vpn"
homepage = "https://github.com/TeaDrinkingProgrammer/archway-vpn"

[features]
# Builds src/lib.rs, which exposes the parsers to the fuzz targets in fuzz/ (see fuzz/README.md). The app never needs it.
fuzzing = []

[dependencies]
ashpd = { version = "0.13", default-features = false, features = ["async-io", "file_chooser"] }
async-io = "2.6.0"
data-encoding = "2"
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "glow", "links", "wayland", "x11"] }
env_logger = { version = "0.11.11", default-features = false, features = ["auto-color", "humantime"] }
futures-util = "0.3.34"
getrandom = "0.4"
ipnet = "2.12"
libc = "0.2.190"
netlink-packet-route = "0.33"
netlink-sys = "0.9"
opener = { version = "0.9.0", features = ["reveal"] }
percent-encoding = "2"
quick-xml = "0.41"
ring = "0.17"
rtnetlink = { version = "0.23", default-features = false, features = ["smol_socket"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8.4"
secret-service = { version = "5.2", features = ["rt-async-io-crypto-rust"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_vici = "0.1"
toml = { version = "1.1", features = ["preserve_order"] }
vec1 = { version = "1.12", features = ["serde"] }
x509-parser = "0.18.1"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
zeroize = "1.9"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[lints.clippy]
# the backend runs as root: every unsafe block says why it is sound
undocumented_unsafe_blocks = "warn"

[profile.release]
strip = true
# a binary a third smaller (22.6 -> 14.5 MB) for a slower release build; the UI is no slower to draw at "s"
opt-level = "s"
lto = "fat"
codegen-units = 1

# Release packages: `cargo deb` and `cargo generate-rpm` (see .github/workflows/release.yml). Dependencies are listed by
# hand: the GUI libs are dlopen()ed, so automatic detection would miss them.
[package.metadata.deb]
copyright = "2026 Stijn van Houwelingen, Wilco van Beijnum"
extended-description = """\
FortiGate connections run on a private strongSwan charon instance and ask \
for root through pkexec only while the tunnel is being set up. Azure VPN \
connections run on OpenVPN 3 Linux. Install archway-vpn-ipsec or \
archway-vpn-openvpn for the engine your connections need."""
section = "net"
priority = "optional"
depends = [
    # dlopen()ed by winit/glutin/zbus
    "libegl1",
    "libgl1",
    "libwayland-client0",
    "libwayland-egl1",
    "libxkbcommon0",
    # The eframe "x11" feature: winit dlopen()s these only in an X11 session (libX11, libXcursor, libX11-xcb, libXi in
    # XConnection::new; libxcb through x11rb; libxkbcommon-x11). Hard dependencies so X11 users always get a starting app;
    # on Wayland they cost little, as Xwayland already brings them.
    "libx11-6",
    "libx11-xcb1",
    "libxcb1",
    "libxcursor1",
    "libxi6",
    "libxkbcommon-x11-0",
    # opens the SSO login page in the browser (src/saml.rs, opener crate)
    "xdg-utils",
    "libc6",
    "libgcc-s1",
]
# no Secret Service provider listed: Debian/Ubuntu have no virtual package for it
recommends = ["libgl1-mesa-dri", "libegl-mesa0"]
# one package per VPN engine (the variants below), named after the engine, not a vendor, so connection types that share an
# engine share it; a user installs only the one their connections need
suggests = ["archway-vpn-ipsec", "archway-vpn-openvpn"]
# target/release is cargo-deb's placeholder for the real target dir; keep it as written
assets = [
    ["target/release/archway-vpn", "usr/bin/", "755"],
    ["assets/archway-vpn.desktop", "usr/share/applications/", "644"],
    ["assets/archway-vpn.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["LICENSE-MIT", "usr/share/doc/archway-vpn/", "644"],
    ["LICENSE-APACHE", "usr/share/doc/archway-vpn/", "644"],
    # the bundled fonts' licences
    ["assets/fonts/IBM-Plex-OFL.txt", "usr/share/doc/archway-vpn/", "644"],
    ["assets/fonts/Lucide-LICENSE.txt", "usr/share/doc/archway-vpn/", "644"],
    ["assets/fonts/NotoEmoji-OFL.txt", "usr/share/doc/archway-vpn/", "644"],
]

# The VPN engines, one package each (`cargo deb --variant <name>`): only dependencies, plus the licence so the package
# isn't empty. A variant's settings replace the base ones, not add to them.
[package.metadata.deb.variants.ipsec]
name = "archway-vpn-ipsec"
extended-description = """\
Installs strongSwan, pkexec, systemd and iproute2, the IPsec (IKEv2) engine Archway's \
FortiGate connections run on."""
# charon-systemd is the binary the app starts; the plugin packages hold openssl, eap-mschapv2, eap-gtc, eap-md5;
# pkexec gives the backend root; systemd and ip clean up the routes if the backend dies
depends = [
    "archway-vpn",
    "charon-systemd",
    "libstrongswan-standard-plugins",
    "libcharon-extra-plugins",
    "libcharon-extauth-plugins",
    "pkexec",
    "systemd",
    "iproute2",
]
recommends = []
suggests = []
assets = [["LICENSE-MIT", "usr/share/doc/archway-vpn-ipsec/", "644"]]

[package.metadata.deb.variants.openvpn]
name = "archway-vpn-openvpn"
extended-description = """\
Installs OpenVPN 3 Linux, the OpenVPN engine Archway's Azure VPN \
connections run on. Most releases need OpenVPN's package repository \
for it."""
depends = ["archway-vpn", "openvpn3-client"]
recommends = []
suggests = []
assets = [["LICENSE-MIT", "usr/share/doc/archway-vpn-openvpn/", "644"]]

[package.metadata.generate-rpm]
# requires below are complete; rpm's own detection only sees linked libs
auto-req = "no"
assets = [
    { source = "target/release/archway-vpn", dest = "/usr/bin/archway-vpn", mode = "755" },
    { source = "assets/archway-vpn.desktop", dest = "/usr/share/applications/archway-vpn.desktop", mode = "644" },
    { source = "assets/archway-vpn.svg", dest = "/usr/share/icons/hicolor/scalable/apps/archway-vpn.svg", mode = "644" },
    { source = "LICENSE-MIT", dest = "/usr/share/licenses/archway-vpn/LICENSE-MIT", mode = "644", doc = true },
    { source = "LICENSE-APACHE", dest = "/usr/share/licenses/archway-vpn/LICENSE-APACHE", mode = "644", doc = true },
    # the bundled fonts' licences
    { source = "assets/fonts/IBM-Plex-OFL.txt", dest = "/usr/share/licenses/archway-vpn/IBM-Plex-OFL.txt", mode = "644", doc = true },
    { source = "assets/fonts/Lucide-LICENSE.txt", dest = "/usr/share/licenses/archway-vpn/Lucide-LICENSE.txt", mode = "644", doc = true },
    { source = "assets/fonts/NotoEmoji-OFL.txt", dest = "/usr/share/licenses/archway-vpn/NotoEmoji-OFL.txt", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
# dlopen()ed by winit/glutin/zbus
libwayland-client = "*"
libwayland-egl = "*"
libxkbcommon = "*"
libglvnd-egl = "*"
libglvnd-glx = "*"
# The eframe "x11" feature: winit dlopen()s these only in an X11 session (libX11, libXcursor, libX11-xcb, libXi in
# XConnection::new; libxcb through x11rb; libxkbcommon-x11). Hard dependencies so X11 users always get a starting app;
# on Wayland they cost little, as Xwayland already brings them.
libX11 = "*"
libX11-xcb = "*"
libxcb = "*"
libXcursor = "*"
libXi = "*"
libxkbcommon-x11 = "*"
xdg-utils = "*"
glibc = "*"
libgcc = "*"

# no Secret Service provider listed: Fedora has no generic provide for it
[package.metadata.generate-rpm.recommends]
mesa-dri-drivers = "*"

# one package per VPN engine (the variants below), named after the engine, not a vendor, so connection types that share an
# engine share it; a user installs only the one their connections need
[package.metadata.generate-rpm.suggests]
archway-vpn-ipsec = "*"
archway-vpn-openvpn = "*"

# The VPN engines, one package each (`cargo generate-rpm --variant <name>`): only dependencies, plus the licence so the
# package isn't empty. A variant's tables replace the base ones, not add to them.
[package.metadata.generate-rpm.variants.ipsec]
name = "archway-vpn-ipsec"
summary = "IPsec engine for Archway's FortiGate connections: strongSwan, polkit, systemd and iproute"
assets = [
    { source = "LICENSE-MIT", dest = "/usr/share/licenses/archway-vpn-ipsec/LICENSE-MIT", mode = "644", doc = true },
]
requires = { archway-vpn = "*", strongswan = "*", polkit = "*", systemd = "*", iproute = "*" }
recommends = {}
suggests = {}

[package.metadata.generate-rpm.variants.openvpn]
name = "archway-vpn-openvpn"
summary = "OpenVPN engine for Archway's Azure VPN connections: OpenVPN 3 Linux (from the dsommers/openvpn3 Copr)"
assets = [
    { source = "LICENSE-MIT", dest = "/usr/share/licenses/archway-vpn-openvpn/LICENSE-MIT", mode = "644", doc = true },
]
requires = { archway-vpn = "*", openvpn3-client = "*" }
recommends = {}
suggests = {}
