name: release

# Publishing a release in GitHub (Releases > Draft a new release, with a new tag such as v0.3.0) builds the packages
# and adds them to that release.
on:
  release:
    types: [published]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # first, so a bad tag fails in seconds and not after the long build
      - name: Tag matches the Cargo.toml version
        run: |
          want=v$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml (expected $want)" >&2
            exit 1
          fi
      # the version and components in rust-toolchain.toml
      - name: Install Rust
        run: rustup toolchain install
      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --locked

  packages:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Debian 12 (glibc 2.36), so the binary runs on every distro at least that new: Debian 12/13, Ubuntu 24.04/26.04,
    # Fedora, Arch. Not the ubuntu-24.04 runner: a binary needs at least the glibc it was built against, and 24.04's
    # 2.39 would leave Debian 12 out (newer runners drop Ubuntu 24.04 and Debian 13 too). No -dev packages needed: the
    # GUI libs are dlopen()ed at run time.
    # Tag plus digest of the multi-arch index; keep the Rust version in step with rust-toolchain.toml.
    container: docker.io/library/rust:1.96.0-bookworm@sha256:5e2214abe154fe26e39f64488952e5c991eeed1d6d6da7cc8381ae83927f0cfc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # no rust-cache: a release builds from a clean slate, so a poisoned cache can't end up in the packages
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deb@3.8.0,cargo-generate-rpm@0.21.0
      - name: cargo build
        run: cargo build --release --locked
      # contents and dependencies: [package.metadata.deb] and [package.metadata.generate-rpm] in Cargo.toml
      # the app, then one package per VPN engine that only pulls the engine in (the variants)
      - name: cargo deb
        run: |
          cargo deb --no-build -o dist/
          cargo deb --no-build -o dist/ --variant ipsec
          cargo deb --no-build -o dist/ --variant openvpn
      - name: cargo generate-rpm
        run: |
          cargo generate-rpm -o dist/
          cargo generate-rpm -o dist/ --variant ipsec
          cargo generate-rpm -o dist/ --variant openvpn
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: dist/*
          if-no-files-found: error

  release:
    needs: packages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write # attestation: sign with the workflow's OIDC identity
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist
      # build provenance for the packages and SHA256SUMS: `gh attestation verify <file> -R <owner>/<repo>` proves a
      # file was built by this workflow from the release tag
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Add the packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/*
